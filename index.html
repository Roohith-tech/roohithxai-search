    <script>
        document.getElementById('custom-search-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                let query = this.value.trim();
                if (query.length > 0) {
                    // Instantly redirects directly to your custom Google Search Engine results page
                    window.location.href = `https://google.com{encodeURIComponent(query)}`;
                }
            }
        });

        // Makes the AI Mode button execute a search as well
        document.getElementById('ai-btn').addEventListener('click', function() {
            let query = document.getElementById('custom-search-input').value.trim();
            if (query.length > 0) {
                window.location.href = `https://google.com{encodeURIComponent(query + " AI breakdown")}`;
            } else {
                alert('Please type a search query first to use AI Mode!');
            }
        });
    </script>
